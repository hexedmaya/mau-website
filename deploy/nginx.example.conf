# Example nginx settings for the site (nginx behind Cloudflare, like mau.melloo.me). Adjust names and paths.
# This file is an example, it has not been run against a live server.
#
# Every page of the site has its own index.html, so nginx serves files and answers everything else with a
# real 404 that shows 404.html. No fallback to index.html is needed.

server {
    listen 80;
    server_name mau.melloo.me;

    root /var/www/mau-website;
    index index.html;

    # /docs redirects to /docs/. Without this nginx puts its own scheme and port into the redirect, and behind
    # Cloudflare that becomes http://. With it the redirect stays relative and keeps https.
    absolute_redirect off;

    # Unknown addresses: status 404 and the styled page of the site.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The license and brand pages read these files. They have no extension or one nginx does not know.
    location = /LICENSE           { default_type text/plain; }
    location = /vendor/mau/LICENSE { default_type text/plain; }
    location = /BRAND-POLICY.md   { default_type text/plain; }

    # Headers. add_header in a location replaces the ones set here, so keep them on the server level.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml text/plain;
}
