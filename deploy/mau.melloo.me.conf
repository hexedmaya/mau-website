# The site config for mau.melloo.me on the server (/etc/nginx/sites-available/mau.melloo.me).
# Same as the example, plus the real visitor IP from Cloudflare and no-cache.
server {
    listen 80;
    listen [::]:80;
    server_name mau.melloo.me;
    set_real_ip_from 192.168.178.39;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    root /opt/mau.melloo.me/public;
    index index.html;

    absolute_redirect off;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /LICENSE            { default_type text/plain; }
    location = /vendor/mau/LICENSE { default_type text/plain; }
    location = /BRAND-POLICY.md    { default_type text/plain; }

    # add_header in a location replaces the ones of the server level, so the frame page repeats them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'self'; frame-ancestors 'self'" always;

    location = /playground/frame.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' blob:; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml text/plain;
}
